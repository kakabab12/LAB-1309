<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Word-like preview: the template's Korean Myeongjo fonts rendered with Noto Serif CJK KR as it is. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>HY신명조</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>한양신명조</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>한컴바탕</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>한양견명조</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HY견명조</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>한양중고딕</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>HY중고딕</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>한양견고딕</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
</fontconfig>
